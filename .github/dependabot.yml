version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/jaysqvl"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    versioning-strategy: "increase"
    groups:
      react-runtime:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next-framework:
        patterns: ["next", "eslint-config-next"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/postcss"]
    # Types must describe the minimum verified runtime used by CI, not a newer
    # Node major whose APIs may be absent in the deployed Node 22 runtime.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "security"

name: Dependency Checks

on:
  pull_request:
  push:
    branches:
      - main
      - redesign/homelab-neutral

permissions:
  contents: read

jobs:
  # Keep the audit mandatory without letting an upstream advisory hide
  # independent lint, build, or browser regressions.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaysqvl
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jaysqvl/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies (no exceptions)
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies (reviewed, expiring development exception)
        run: npm run audit:dependencies

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaysqvl

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jaysqvl/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Production browser tests
        run: npm run test:e2e
